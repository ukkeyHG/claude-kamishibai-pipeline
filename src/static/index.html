<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamishibai Auto-Gen Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: rgba(30, 41, 59, 0.7);
            --card-bg: rgba(30, 41, 59, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --pending: #475569;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        .sidebar {
            width: 300px;
            min-width: 300px;
            flex-shrink: 0;
            height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            z-index: 10;
        }

        .sidebar h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 24px 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .episode-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .episode-item {
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .episode-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .episode-item.active {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .ep-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 1.1rem;
        }

        .ep-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }

        .main-content {
            flex-grow: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Pipeline Grid */
        .pipeline-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 10px;
        }

        .phase-card {
            padding: 20px;
            position: relative;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .phase-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .phase-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .phase-status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Status Colors */
        .status-pending {
            background: rgba(71, 85, 105, 0.3);
            color: #94a3b8;
        }

        .status-running {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid var(--accent-primary);
            animation: pulse-glow 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 5px var(--accent-glow);
                background: rgba(59, 130, 246, 0.1);
            }

            50% {
                box-shadow: 0 0 35px var(--accent-primary);
                background: rgba(59, 130, 246, 0.35);
            }

            100% {
                box-shadow: 0 0 5px var(--accent-glow);
                background: rgba(59, 130, 246, 0.1);
            }
        }

        .status-completed {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .status-failed {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .phase-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        .detail-value {
            font-weight: 600;
            color: #e2e8f0;
        }

        .token-highlight {
            color: #34d399;
            text-shadow: 0 0 5px rgba(52, 211, 153, 0.3);
        }

        .time-block {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .time-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .time-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .time-value {
            font-size: 0.85rem;
            font-family: monospace;
            color: var(--text-primary);
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            flex-grow: 1;
            min-height: 0;
            overflow: hidden;
        }

        .panel {
            padding: 24px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .panel h2 {
            margin: 0 0 16px 0;
            font-size: 1.1rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .scrollable-area {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 8px;
            min-height: 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .markdown-body {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .markdown-body h2 {
            font-size: 1.2rem;
            color: #60a5fa;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 4px;
            margin-top: 24px;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent-primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <h1>Dashboard</h1>
        <ul class="episode-list" id="episodeList">
            <div class="loader"></div>
        </ul>
    </aside>

    <main class="main-content">
        <!-- Pipeline UI -->
        <div class="pipeline-container" id="pipelineGrid">
            <!-- Phase Cards injected by JS -->
        </div>

        <div class="content-grid">
            <div class="panel glass">
                <h2>Raw Logs</h2>
                <div class="scrollable-area" id="logsArea"
                    style="font-family: monospace; font-size: 0.8rem; line-height: 1.5; color: var(--text-secondary); white-space: pre-wrap;">
                    <div class="empty-state">Select an episode</div>
                </div>
            </div>

            <div class="panel glass">
                <h2>Review History</h2>
                <div class="scrollable-area">
                    <div class="markdown-body" id="reviewArea">
                        <div class="empty-state">No review history available</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentEpisode = null;

        const PHASES = [
            { id: "phase_1", name: "1. Design", matcher: "design" },
            { id: "phase_2", name: "2. Narration", matcher: "narration" },
            { id: "phase_3", name: "3. Image Prompts", matcher: "image_prompt" },
            { id: "phase_4", name: "4. Video Prompts", matcher: "video_prompt" },
            { id: "phase_5", name: "5. BGM Prompts", matcher: "bgm" },
            { id: "phase_6", name: "6. YouTube", matcher: "youtube" }
        ];

        async function fetchEpisodes() {
            try {
                const res = await fetch('/api/episodes');
                const data = await res.json();
                renderEpisodeList(data);
            } catch (e) {
                console.error('Failed to fetch episodes', e);
            }
        }

        function renderEpisodeList(episodes) {
            const list = document.getElementById('episodeList');
            list.innerHTML = '';

            if (episodes.length === 0) {
                list.innerHTML = '<div class="empty-state">No episodes found</div>';
                return;
            }

            episodes.forEach(ep => {
                const li = document.createElement('li');
                li.className = `episode-item glass ${currentEpisode === ep.id ? 'active' : ''}`;
                li.onclick = () => selectEpisode(ep.id, ep.total_tokens);

                li.innerHTML = `
                    <div class="ep-title">${ep.id}</div>
                    <div class="ep-meta">
                        <span>Phase: ${ep.status.split('_')[0] || ep.status}</span>
                        <span>Tokens: ${ep.total_tokens.toLocaleString()}</span>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        async function selectEpisode(id, totalTokens) {
            currentEpisode = id;
            fetchEpisodes(); // update active state

            document.getElementById('pipelineGrid').innerHTML = '<div class="loader" style="margin-top:40px; grid-column: 2;"></div>';

            try {
                const res = await fetch(`/api/episodes/${id}`);
                const data = await res.json();
                renderDetails(data);
            } catch (e) {
                console.error('Failed to fetch details', e);
            }
        }

        function renderDetails(data) {
            // Aggregate logs into Pipeline state
            let pipelineState = {};
            PHASES.forEach(p => {
                pipelineState[p.matcher] = { status: 'Pending', iter: '-', attempt: '-', tokens: 0, agent: '-', startTime: null, endTime: null };
            });

            let rawLogText = "";
            let lastMatchedPhaseMatcher = null;

            data.logs.forEach(log => {
                const phaseStr = log.phase || "";
                const msg = log.message.toLowerCase();

                // Track raw text for dump
                const d = new Date(log.ts);
                const timeStr = `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}:${d.getSeconds().toString().padStart(2, '0')}`;
                rawLogText += `[${timeStr}] [${log.agent}] ${log.phase} : ${log.message}\n`;

                // If pipeline aborted, mark the last active phase as failed
                if (phaseStr === "pipeline_aborted" || (phaseStr === "pipeline" && (msg.includes("aborted") || msg.includes("failed")))) {
                    if (lastMatchedPhaseMatcher) {
                        pipelineState[lastMatchedPhaseMatcher].status = 'Failed';
                        pipelineState[lastMatchedPhaseMatcher].endTime = timeStr;
                    }
                    return;
                }

                // Find matching phase
                const matchedPhase = PHASES.find(p => phaseStr.includes(p.matcher));
                let pKey = null;
                
                if (matchedPhase) {
                    pKey = matchedPhase.matcher;
                    lastMatchedPhaseMatcher = pKey;
                } else if (lastMatchedPhaseMatcher && (phaseStr.includes("json_") || phaseStr.includes("designer_revise") || phaseStr.includes("reviewer_iter"))) {
                    pKey = lastMatchedPhaseMatcher;
                }
                
                if (!pKey) return;
                
                const state = pipelineState[pKey];

                // If we see a log for this phase, it's at least Running
                if (state.status === 'Pending' || state.status === 'Failed') {
                    state.status = 'Running';
                    state.startTime = timeStr;
                    state.iter = 1;
                }
                state.endTime = timeStr;

                // Extract Iteration from string like "design_gen_iter2" or "Review R=0"
                const iterMatch = phaseStr.match(/iter(\d+)/i) || msg.match(/r=(\d+)/i);
                if (iterMatch) state.iter = parseInt(iterMatch[1]);

                // Extract Attempt from string like "Start (Attempt 2)"
                const attemptMatch = msg.match(/attempt (\d+)/i);
                if (attemptMatch) state.attempt = parseInt(attemptMatch[1]);

                // Track active agent
                if (log.agent) {
                    let friendlyAgent = log.agent;
                    if (log.agent.includes('reviewer')) friendlyAgent = 'Reviewer';
                    else if (log.agent.includes('generator') || log.agent === 'kamishibai-writer') friendlyAgent = 'Generator';
                    state.agent = friendlyAgent;
                }

                // Accumulate tokens
                if (log.tokens) {
                    state.tokens += (log.tokens.in || 0) + (log.tokens.out || 0);
                }

                // Check for completion/failure
                if (msg.includes('go (r=') || msg.includes('review passed') || msg.includes('forced approval')) {
                    state.status = 'Completed';
                } else if (msg.includes('failed') || msg.includes('aborted')) {
                    state.status = 'Failed';
                }
            });

            // If a later phase is running/completed, ensure earlier phases are marked completed
            let latestActiveIndex = -1;
            PHASES.forEach((p, idx) => {
                if (pipelineState[p.matcher].status !== 'Pending') {
                    latestActiveIndex = idx;
                }
            });
            PHASES.forEach((p, idx) => {
                if (idx < latestActiveIndex && pipelineState[p.matcher].status === 'Pending') {
                    pipelineState[p.matcher].status = 'Completed'; // fallback
                }
                if (idx < latestActiveIndex && pipelineState[p.matcher].status === 'Running') {
                    pipelineState[p.matcher].status = 'Completed'; // was interrupted but moved on
                }
            });

            // Render Pipeline Grid
            const grid = document.getElementById('pipelineGrid');
            grid.innerHTML = '';

            PHASES.forEach(p => {
                const state = pipelineState[p.matcher];
                if (state.status === 'Completed') {
                    state.agent = '-';
                }

                let startDisplay = state.startTime || '-';
                let endDisplay = '-';
                if (state.startTime) {
                    endDisplay = (state.status === 'Completed' || state.status === 'Failed') ? state.endTime : '...';
                }

                const card = document.createElement('div');
                card.className = `phase-card glass status-${state.status.toLowerCase()}`;

                card.innerHTML = `
                    <div class="phase-header">
                        <span class="phase-title">${p.name}</span>
                        <span class="phase-status-badge">${state.status}</span>
                    </div>
                    <div class="phase-details">
                        <div class="detail-item">
                            <span class="detail-label">Iteration</span>
                            <span class="detail-value">${state.iter}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Attempt</span>
                            <span class="detail-value">${state.attempt}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Active Agent</span>
                            <span class="detail-value">${state.agent}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Phase Tokens</span>
                            <span class="detail-value token-highlight">${state.tokens.toLocaleString()}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Start Time</span>
                            <span class="detail-value">${startDisplay}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">End Time</span>
                            <span class="detail-value">${endDisplay}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Render Raw Logs
            const logsArea = document.getElementById('logsArea');
            
            // Check state before modifying content
            const isScrolledToBottom = (logsArea.scrollHeight - logsArea.clientHeight) <= (logsArea.scrollTop + 50);
            const currentScrollTop = logsArea.scrollTop;
            
            logsArea.textContent = rawLogText || 'No logs found.';
            
            if (isScrolledToBottom) {
                // If they were at the bottom, stay at the bottom
                logsArea.scrollTop = logsArea.scrollHeight;
            } else {
                // Otherwise, preserve their exact scroll position
                logsArea.scrollTop = currentScrollTop;
            }

            // Render Review History
            const reviewArea = document.getElementById('reviewArea');
            if (!data.review_history.trim()) {
                reviewArea.innerHTML = '<div class="empty-state">No review history available yet</div>';
            } else {
                reviewArea.innerHTML = marked.parse(data.review_history);
            }
        }

        fetchEpisodes();
        setInterval(() => {
            fetchEpisodes();
            if (currentEpisode) {
                fetch(`/api/episodes/${currentEpisode}`)
                    .then(r => r.json())
                    .then(data => renderDetails(data))
                    .catch(e => console.error(e));
            }
        }, 3000);

    </script>
</body>

</html>
